name: Instagram — post do dia

# Segundas, quartas e sextas, perto das 19h (Brasília), publica o post APROVADO do dia.
# O agendador do GitHub costuma atrasar alguns minutos, por isso há dois horários. O segundo só publica
# se o primeiro não tiver publicado, e o script nunca publica fora da janela das 18h às 23h.
# As mídias vão para o branch `instagram-midia` (fora do main).
on:
  schedule:
    - cron: "52 21 * * 1,3,5"   # 18h52 em Brasília
    - cron: "35 22 * * 1,3,5"   # 19h35, reserva
  workflow_dispatch:
    inputs:
      id:
        description: "Publicar um post específico (ex.: 003). Vazio = o do dia."
        required: false

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Branch das mídias
        run: |
          git fetch origin instagram-midia || true
          if git rev-parse --verify origin/instagram-midia >/dev/null 2>&1; then
            git worktree add _midia origin/instagram-midia
            git -C _midia checkout -B instagram-midia origin/instagram-midia
          else
            git worktree add --detach _midia
            git -C _midia checkout --orphan instagram-midia
            git -C _midia rm -rf --quiet . || true
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-color-emoji ffmpeg >/dev/null
          pip install -q playwright pillow
          python -m playwright install --with-deps chromium >/dev/null
      - name: Publicar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHATS: ${{ secrets.TELEGRAM_CHATS }}
        run: |
          if [ -z "$IG_TOKEN" ]; then echo "IG_TOKEN não configurado — nada a fazer."; exit 0; fi
          if [ -n "${{ inputs.id }}" ]; then python instagram/publicar.py --id "${{ inputs.id }}"; else python instagram/publicar.py; fi

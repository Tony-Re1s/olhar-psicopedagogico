name: Telegram — aprovações e prévias

# - O bot fica ligado ("escutar"): responde o Telegram na hora, por ~5h30 por turno, e no fim
#   dispara o próximo turno sozinho. O agendamento de hora em hora só religa se ele tiver caído.
# - Quando a pauta muda no main (pauta nova da semana ou post refeito): manda a prévia das artes
#   dos posts em "rascunho".
# - À mão (Run workflow): ler, previa ou ids (mostra no log os ids de quem falou com o bot).
on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths: ["instagram/pauta.json"]
  workflow_dispatch:
    inputs:
      acao:
        description: "escutar, ler, previa, ids ou checar (não rode ler com o bot ligado)"
        required: true
        default: "escutar"

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ (github.event_name == 'schedule' || inputs.acao == 'escutar') && 'escuta' || 'pauta' }}
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qual ação
        id: acao
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then echo "acao=previa" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "acao=${{ inputs.acao }}" >> $GITHUB_OUTPUT
          else echo "acao=escutar" >> $GITHUB_OUTPUT; fi
      - name: Cache do modelo de transcrição de áudio
        if: steps.acao.outputs.acao == 'ler' || steps.acao.outputs.acao == 'escutar'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Conversor de áudio
        if: steps.acao.outputs.acao == 'ler' || steps.acao.outputs.acao == 'escutar'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji >/dev/null
          pip install -q faster-whisper
          if [ "${{ steps.acao.outputs.acao }}" = "escutar" ]; then
            pip install -q playwright pillow
            python -m playwright install --with-deps chromium >/dev/null
          fi
      - name: Dependências da prévia
        if: steps.acao.outputs.acao == 'previa'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-color-emoji ffmpeg >/dev/null
          pip install -q playwright pillow
          python -m playwright install --with-deps chromium >/dev/null
      - name: Rodar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHATS: ${{ secrets.TELEGRAM_CHATS }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.acao.outputs.acao }}" = "checar" ]; then python instagram/checar.py; exit 0; fi
          if [ -z "$TELEGRAM_TOKEN" ]; then echo "TELEGRAM_TOKEN não configurado — nada a fazer."; exit 0; fi
          python instagram/telegram.py "${{ steps.acao.outputs.acao }}"
      - name: Gravar mudanças
        run: |
          git add instagram/pauta.json instagram/config.json instagram/pedidos.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "nada mudou"; exit 0; fi
          git -c user.name="Olhar Bot" -c user.email="bot@users.noreply.github.com" commit -m "bot: ${{ steps.acao.outputs.acao }} pelo Telegram"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
      - name: Começar o próximo turno do bot
        if: success() && steps.acao.outputs.acao == 'escutar'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run telegram.yml --ref main -R ${{ github.repository }} -f acao=escutar
